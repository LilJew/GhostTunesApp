events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json;

    upstream api {
        server api:8000;
    }

    upstream admin {
        server admin:80;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name ghosttune.pro www.ghosttune.pro admin.ghosttune.pro;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── ghosttune.pro — main player ─────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name ghosttune.pro www.ghosttune.pro;

        ssl_certificate     /etc/letsencrypt/live/ghosttune.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ghosttune.pro/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # API proxy
        location /api/v1/ {
            proxy_pass         http://api;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 500m;
        }

        # Static music files (served directly from volume for performance)
        location /static/tracks/ {
            alias /var/music/tracks/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /static/covers/ {
            alias /var/music/covers/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket
        location /ws/ {
            proxy_pass         http://api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
        }

        # Player static files
        location / {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }
    }

    # ── admin.ghosttune.pro ─────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name admin.ghosttune.pro;

        ssl_certificate     /etc/letsencrypt/live/ghosttune.pro/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ghosttune.pro/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        location / {
            proxy_pass       http://admin;
            proxy_set_header Host $host;
        }
    }
}
